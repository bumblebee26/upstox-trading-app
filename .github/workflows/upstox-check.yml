# Manual check that the Upstox token works for every endpoint this repo uses (about 20 calls).
# Needs the repository secret UPSTOX_ANALYTICS_TOKEN. Run from the Actions tab: "Upstox check" > Run workflow.
name: Upstox check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Upstox endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Call each endpoint once
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python scripts/upstox_smoke.py
