# Temporary (PR 9c): can GitHub's runners download the NSE files? Removed before merge.
name: NSE probe

on:
  pull_request:
    paths: [".github/workflows/nse-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try each NSE source
        shell: python
        run: |
          import http.cookiejar, urllib.request
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          op.addheaders = [("User-Agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36"),
                           ("Accept", "*/*"), ("Accept-Language", "en-US,en;q=0.9"), ("Referer", "https://www.nseindia.com/")]
          urls = [
            "https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_26112026.csv",
            "https://nsearchives.nseindia.com/content/equities/bulk.csv",
            "https://nsearchives.nseindia.com/content/equities/block.csv",
            "https://www.nseindia.com/",
            "https://www.nseindia.com/api/corporate-announcements?index=equities",
            "https://www.nseindia.com/api/market-data-pre-open?key=NIFTY",
            "https://www.nseindia.com/api/event-calendar",
          ]
          for u in urls:
              try:
                  r = op.open(u, timeout=20)
                  body = r.read()
                  print("OK ", r.status, len(body), u, body[:120])
              except Exception as e:
                  print("ERR", type(e).__name__, str(e)[:120], u)
