# NSE files and the morning brief (dummy-money paper trader; inputs only, never advice).
#   evening (19:30 IST): save the day's delivery bhavcopy, bulk and block deals, filings and results calendar
#   brief   (08:40 IST): the short morning message on Telegram
# Started by the AWS kicker; the cron lines are backups (GitHub can run them late). Each runs once a day.
name: NSE

on:
  workflow_dispatch:
    inputs:
      job:
        description: "evening or brief"
        required: true
        default: evening
  schedule:
    - cron: "0 14 * * 1-5"   # 19:30 IST evening backup
    - cron: "10 3 * * 1-5"   # 08:40 IST brief backup

permissions:
  contents: read

concurrency:
  group: nse-${{ inputs.job || github.event.schedule }}
  cancel-in-progress: false

jobs:
  nse:
    name: NSE ${{ inputs.job || (github.event.schedule == '0 14 * * 1-5' && 'evening' || 'brief') }}
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 15
    env:
      JOB: ${{ inputs.job || (github.event.schedule == '0 14 * * 1-5' && 'evening' || 'brief') }}
      UPX_STATE_BUCKET: upx-state-538498973473
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Run once today
        run: |
          case "$JOB" in
            evening) phase=nse; module=core.nse ;;
            brief)   phase=brief; module=trader.brief ;;
            *) echo "job must be evening or brief"; exit 1 ;;
          esac
          if python scripts/claim_session.py "$phase"; then
            python -m "$module"
          fi
