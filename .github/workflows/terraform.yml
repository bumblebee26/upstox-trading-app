# Terraform for infra/aws, run by GitHub (dummy-money paper trader; no bank or broker link).
# - Pull request: "terraform plan" with the read-only role; the plan is shown in the run's summary.
# - Merge to main (or a manual run): plan again, then apply, only after the owner clicks Approve in the
#   "infra" environment. The apply role exists only for that environment (infra/bootstrap/github.tf).
# infra/bootstrap stays with the owner's PC: CI can never change the roles it signs in with.
# infra/databricks (the lakehouse) is planned and applied in the same approved run, after infra/aws; the
# Databricks token lives only in the "infra" environment, so pull requests show no Databricks plan.
name: Terraform

on:
  pull_request:
    paths: ["infra/**", "app/**", "core/**", "trader/**", "lambdas/**", "pipeline/**", "lakehouse/history_copy.py", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "app/**", "core/**", "trader/**", "lambdas/**", "pipeline/**", "lakehouse/history_copy.py", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: terraform plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets GitHub sign in to AWS as upx-gha-plan, with no stored key
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.x"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: arn:aws:iam::538498973473:role/upx-gha-plan
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - name: Plan (read only, no state lock)
        run: |
          terraform plan -lock=false -no-color -out=tfplan > plan.txt 2>&1 || { cat plan.txt; exit 1; }
          cat plan.txt
          { echo '### terraform plan (infra/aws)'; echo '```'; terraform show -no-color tfplan | tail -n 200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: terraform apply (needs the owner's approval)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra
    permissions:
      contents: read
      id-token: write # lets GitHub sign in to AWS as upx-gha-apply, only from the infra environment
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.x"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: arn:aws:iam::538498973473:role/upx-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - name: Plan
        run: terraform plan -no-color -out=tfplan

      - name: Apply exactly that plan
        run: terraform apply -no-color tfplan

      - name: Databricks lakehouse (plan, then apply that plan)
        if: vars.DATABRICKS_HOST != ''  # skipped until the owner adds the Databricks settings
        working-directory: infra/databricks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          terraform init
          terraform plan -no-color -out=tfplan
          terraform apply -no-color tfplan
