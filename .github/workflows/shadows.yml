# The shadow strategies (paper tests, no Claude calls), after the close: every intraday variant in
# docs/STRATEGIES.md on today's 1-minute candles, then the swing, long-term and NIFTYBEES shadows and the luck
# lines. Started by the AWS kicker at 16:10 IST; the cron is a backup.
name: Shadows

on:
  workflow_dispatch:
  schedule:
    - cron: "40 10 * * 1-5"  # 16:10 IST backup

permissions:
  contents: read

concurrency:
  group: shadows
  cancel-in-progress: false

jobs:
  shadows:
    name: Shadows
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 120
    env:
      UPX_STATE_BUCKET: upx-state-538498973473
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Run today's shadows once
        run: |
          if python scripts/claim_session.py shadows; then
            python -m shadows.run
            python -m shadows.daily
          fi

      - name: Tell Telegram if the shadows failed
        if: failure()
        run: python -c "from trader import telegram; telegram.send('⚠️ The shadow strategies job stopped with an error; check the Actions log. No real trade is affected.')"
