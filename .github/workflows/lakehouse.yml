# Copy the state bucket into the Databricks landing volume, then run the pipeline each start names, if its own
# files are new (dummy-money paper trader). Started by the AWS kicker: trading 13:05 and 16:55, shadows 17:30,
# market 20:05 IST. The cron line is a backup that only copies files.
name: Lakehouse

on:
  workflow_dispatch:
    inputs:
      pipelines:
        description: "Which pipelines may run: trading, shadows, market (space-separated); empty = sync only"
        type: string
        default: ""
      force:
        description: "Run the named pipelines even if no new file arrived"
        type: boolean
        default: false
  schedule:
    - cron: "35 11 * * 1-5"  # 17:05 IST backup

permissions:
  contents: read

concurrency:
  group: lakehouse
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to Databricks
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 30
    env:
      UPX_STATE_BUCKET: upx-state-538498973473
      PYTHONUNBUFFERED: "1"
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      UPX_FORCE_PIPELINE: ${{ inputs.force || false }}
      UPX_PIPELINES: ${{ inputs.pipelines }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Sync, run the pipeline and wait for it
        run: python -m lakehouse.sync
