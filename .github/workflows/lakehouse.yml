# Copy the state bucket into the Databricks landing volume, then start the lakehouse pipeline if anything new
# arrived (dummy-money paper trader). Started by the AWS kicker 4 times a day; the cron lines are backups.
name: Lakehouse

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * 1-5"  # 17:05 IST backup

permissions:
  contents: read

concurrency:
  group: lakehouse
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to Databricks
    if: vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 20
    env:
      UPX_STATE_BUCKET: upx-state-538498973473
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Sync and start the pipeline
        run: python -m lakehouse.sync
