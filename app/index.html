<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Paper trader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#F1F5F9;--card:#FFFFFF;--fg:#0F172A;--mute:#475569;--line:#E2E8F0;--soft:#F1F5F9;--tile:#F8FAFC;
--up:#15803D;--dn:#B91C1C;--accent:#15803D;--shadow:0 1px 2px rgba(15,23,42,.06);color-scheme:light}
:root[data-theme=dark]{--page:#000000;--card:#121212;--fg:#F5F5F5;--mute:#A3A3A3;--line:#262626;--soft:#1C1C1C;
--tile:#1C1C1C;--up:#22C55E;--dn:#F87171;--accent:#22C55E;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:14px/1.4 Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--card);padding:14px 16px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:20px;font-weight:700}
.pill{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.search{position:relative;margin:12px 0}
.search input{width:100%;min-height:44px;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--fg);font:inherit;font-size:15px}
.search svg{position:absolute;left:12px;top:13px}
.sugg{position:absolute;left:0;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:6}
.sub{display:flex;gap:24px;margin-top:10px}
.sub button{background:none;border:0;padding:8px 0 10px;margin-bottom:-14px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;min-height:40px}
.sub button[aria-pressed=true]{color:var(--fg);font-weight:600;border-color:var(--accent)}
main{padding:12px;display:flex;flex-direction:column;gap:12px;flex:1;padding-bottom:84px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sw{background:none;border:0;padding:4px 2px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:32px}
.lbl{font-size:12px;color:var(--mute)}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.day{font-size:12px;font-weight:700;background:var(--soft);border-radius:999px;padding:3px 10px}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--mute)}
.tiles{display:grid;gap:8px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.tile .c{font-size:12px;font-weight:600}
.plain .tile{background:var(--card)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--soft);padding-top:8px}
.row .n{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .n span{font-size:12px;color:var(--mute)}
.row .r{font-weight:600;text-align:right;white-space:nowrap}
.more{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;align-self:flex-start}
.seg{display:grid;background:var(--soft);border-radius:10px;padding:3px}
.seg button{min-height:36px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--card)}
.note{margin:0;font-size:13px;color:var(--mute);line-height:1.45}
.cw{position:relative}
.cw svg{display:block;width:100%;height:160px;border-radius:8px;background:var(--tile);touch-action:pan-y}
.ya{position:absolute;left:4px;top:0;transform:translateY(-50%);font-size:10px;color:var(--mute);pointer-events:none;background:color-mix(in srgb,var(--tile) 80%,transparent);padding:0 2px;border-radius:3px}
.xa{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:3px}
.ov{position:absolute;inset:0;pointer-events:none}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--mute);opacity:.6}
.dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:2px solid var(--card)}
.gd{position:absolute;top:0;font-size:10px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:12px;padding:6px 2px 0}
.tl{display:flex;align-items:center;gap:5px;white-space:nowrap}.tl i{width:8px;height:3px;border-radius:2px}.tl b{margin-left:auto;padding-left:10px}
.tip{position:absolute;top:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.35;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:70%}
details.lgd summary{min-height:36px;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;list-style:none}
details.lgd summary::-webkit-details-marker{display:none}
.lg{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-size:12px;margin:0 6px 6px 0;cursor:pointer}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lg[aria-pressed=true]{border-color:var(--accent);background:var(--card)}
.sec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec button{border:0;border-radius:8px;padding:8px;background:var(--soft);text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:52px}
.sec button[aria-pressed=true]{outline:2px solid var(--accent)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
nav.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav.bar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.bar button{background:none;border:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;color:var(--mute);cursor:pointer}
nav.bar button[aria-current=page]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header id="hdr"></header>
<main id="main" aria-live="polite"></main>
</div>
<nav class="bar" aria-label="Main"><div id="nav"></div></nav>
<script>
"use strict";
// ---- State and preferences (kept on this phone only) -------------------------------------------------------
const P = (() => { try { return JSON.parse(localStorage.getItem("upx-prefs") || "{}"); } catch (e) { return {}; } })();
function save() { try { localStorage.setItem("upx-prefs", JSON.stringify(P)); } catch (e) { /* private mode */ } }
const S = {tab: P.tab || "stocks", sub: P.sub || "desk", q: "", open: {}, sector: null, page: null,
           list: 0, feed: "All", data: null, stocks: null, error: null};
if (P.theme) document.documentElement.dataset.theme = P.theme;

// ---- Formatting ---------------------------------------------------------------------------------------------
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
const rs = (v, d = 0) => v == null ? "–" : (v < 0 ? "−" : "") + "₹" + num(Math.abs(v), d);
const srs = (v, d = 0) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + "₹" + num(Math.abs(v), d);
const pct = (v, d = 2) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "mute";
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dm = d => { if (!d) return ""; const x = String(d).slice(0, 10).split("-"); return +x[2] + " " + MON[+x[1] - 1]; };
const hm = t => t ? String(t).slice(11, 16) : "";
const POOL = {intraday: "Intraday", swing: "Swing", long_term: "Long-term"};

// ---- Data helpers --------------------------------------------------------------------------------------------
const ds = name => ((S.data && S.data.datasets && S.data.datasets[name]) || {}).rows || [];
const market = item => ((S.data && S.data.markets) || []).find(m => m.item === item);
const stockOf = sym => (S.stocks && S.stocks.bySym[sym]) || null;
const link = sym => { const s = stockOf(sym); return s ? `<a href="${esc(s.u)}" target="_blank" rel="noopener" aria-label="${esc(sym)} on Upstox">Upstox ↗</a>` : ""; };
function poolSeries(pool) { return ds("pool_days").filter(r => !pool || r.pool === pool); }
function latestDay(rows, key = "day") { return rows.reduce((m, r) => r[key] > m ? r[key] : m, ""); }
function poolNow(pool) {  // {balance, prev, start, open, day}
  const rows = poolSeries(pool).sort((a, b) => a.day < b.day ? -1 : 1);
  if (!rows.length) return null;
  const last = rows[rows.length - 1], prev = rows.length > 1 ? rows[rows.length - 2] : null;
  return {balance: last.balance, prev: prev ? prev.balance : last.starting_capital, start: last.starting_capital,
          open: last.open_positions || 0, day: last.day};
}
const pools = () => (S.data && S.data.pools) || {};
const charts = () => (S.data && S.data.charts) || [];
const js = v => { try { return v ? JSON.parse(v) : null; } catch (e) { return null; } };
const latestEvent = (pool, event) => ds("decisions").find(e => e.pool === pool && e.event === event);
function todaysRead() {  // one line worked out from the day's prices
  const eq = ds("eq_day"), sec = sectors();
  if (!eq.length || !sec.length) return "";
  const up = eq.filter(r => r.change_pct > 0).length, dn = eq.filter(r => r.change_pct < 0).length;
  const mood = up > dn * 1.5 ? "Broad rise" : dn > up * 1.5 ? "Broad fall" : "Mixed day";
  return `${mood}: ${num(up)} up, ${num(dn)} down; best ${esc(sec[0].name)} ${pct(sec[0].chg)}, worst ${esc(sec[sec.length - 1].name)} ${pct(sec[sec.length - 1].chg)} (${dm(sec[0].day)}).`;
}
const lastTradeDay = () => latestDay(ds("decisions"), "trade_date");
const events = (pool, day) => ds("decisions").filter(e => (!pool || e.pool === pool) && (!day || e.trade_date === day));

// ---- Widgets -------------------------------------------------------------------------------------------------
const card = (title, body, right = "") => `<section class="card">${title ? `<div class="ch"><h2>${title}</h2>${right}</div>` : ""}${body}</section>`;
const row = (name, sub, right, c = "") => `<div class="row"><div class="n"><b style="font-weight:600">${name}</b>${sub ? `<span>${sub}</span>` : ""}</div><span class="r ${c}">${right}</span></div>`;
const tile = (l, v, c, cc = "mute") => `<div class="tile"><span class="lbl">${l}</span><b>${v}</b><span class="c ${cc}">${c}</span></div>`;
const tiles = (items, n, plain) => `<div class="tiles${plain ? " plain" : ""}" style="grid-template-columns:repeat(${n || items.length},minmax(0,1fr))">${items.join("")}</div>`;
const note = t => `<p class="note">${t}</p>`;
function sw(id, options) {  // the small ‹ › switch; returns [button html, chosen option]
  const i = ((P.sw || {})[id] || 0) % options.length;
  return [`<button class="sw" data-sw="${id}" data-n="${options.length}" aria-label="Switch ${esc(options[i])}">‹ ${esc(options[i])} ›</button>`, options[i]];
}
function seg(id, options) {
  const on = (P.seg || {})[id] || options[0];
  return [`<div class="seg" role="group" style="grid-template-columns:repeat(${options.length},minmax(0,1fr))">${options.map(o => `<button data-seg="${id}" data-v="${o}" aria-pressed="${o === on}">${o}</button>`).join("")}</div>`, on];
}
function topN(id, rows, n = 5) {  // top 5 + Show all
  const all = S.open[id];
  return rows.slice(0, all ? rows.length : n).join("") + (rows.length > n ? `<button class="more" data-more="${id}">${all ? "Show less" : "Show all " + rows.length}</button>` : "");
}
function hero(label, value, chg, chgPct, sub) {
  const day = chg > 0 ? "Green day" : chg < 0 ? "Red day" : "Flat day";
  return `<section class="card" style="gap:6px"><span class="lbl">${label}</span><span class="big">${value}</span>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="${cls(chg)}" style="font-weight:700">${srs(chg)} (${pct(chgPct)})</span>
    <span class="day ${cls(chg)}">${day}</span></div>${sub ? `<span class="note">${sub}</span>` : ""}</section>`;
}

// ---- Charts: ‹ Bar › (Bar, Line, Area) and ‹ 1M › (range); folded legend; tap to read -------------------------
const RANGES = ["1D", "1W", "1M", "3M", "6M", "1Y", "All"], RDAYS = {"1D": 1, "1W": 7, "1M": 31, "3M": 92, "6M": 183, "1Y": 366, "All": 1e5};
const COLORS = ["#2563EB", "#D97706", "#7C3AED", "#0891B2", "#DB2777", "#64748B", "#DC2626", "#0D9488"];
const CH = {};
function chart(id, title, series, unit, defaultRange = "1M", top = "", rebase = false) {
  // series: [{name, pts: [[day, value]], real, dash, home}]; values are ₹ or % (unit).
  // rebase: show each line as its % change from the first day in view (prices on different scales).
  if (!series.some(s => s.pts.length)) return "";
  if (rebase && (P.sw || {})[id + ":k"] == null) { P.sw = P.sw || {}; P.sw[id + ":k"] = 1; }  // starts as Line
  const [kSw, kind] = sw(id + ":k", ["Bar", "Line", "Area"]);
  const ri = (P.sw || {})[id + ":r"]; if (ri == null) { P.sw = P.sw || {}; P.sw[id + ":r"] = RANGES.indexOf(defaultRange); }
  const [rSw, range] = sw(id + ":r", RANGES);
  const end = series.reduce((m, s) => s.pts.length && s.pts[s.pts.length - 1][0] > m ? s.pts[s.pts.length - 1][0] : m, "");
  const from = new Date(new Date(end).getTime() - RDAYS[range] * 864e5).toISOString().slice(0, 10);
  const shown = series.map((s, i) => ({...s, color: s.real ? "var(--accent)" : COLORS[i % COLORS.length], pts: s.pts.filter(p => p[0] > from || range === "1D" && p[0] >= end)}));
  if (rebase) shown.forEach(s => { const b = s.pts.length && s.pts[0][1]; s.pts = b ? s.pts.map(p => [p[0], (p[1] / b - 1) * 100]) : []; });
  const last = s => s.pts.length ? s.pts[s.pts.length - 1][1] : null, others = shown.filter(s => !s.home && last(s) != null);  // home: the lines being compared (India here)
  const read = rebase && shown.find(s => s.real) && others.length ? note(`${esc(shown.find(s => s.real).name)} ${pct(last(shown.find(s => s.real)))} vs world average ${pct(others.reduce((t, s) => t + last(s), 0) / others.length)}.`) : "";
  const days = [...new Set(shown.flatMap(s => s.pts.map(p => p[0])))].sort();
  if (!days.length) return "";
  const vals = shown.flatMap(s => s.pts.map(p => p[1])).concat([0]);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const W = 340, H = 150, pad = 14, x = i => days.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (days.length - 1), y = v => H - pad - (v - lo) * (H - 2 * pad) / (hi - lo);
  const hl = (P.hl || {})[id];
  let svg = `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>`;
  const barOf = kind === "Bar" ? (shown.find(x => x.real) || shown[0]) : null;  // Bar: the main line as bars, the rest as lines
  shown.forEach(s => {
    const dim = hl && hl !== s.name ? 0.25 : 1, idx = new Map(days.map((d, i) => [d, i]));
    if (s === barOf) {
      const bw = Math.max(2, (W - 2 * pad) / days.length - 2);
      s.pts.forEach(p => { const v = y(p[1]), z = y(0); svg += `<rect x="${x(idx.get(p[0])) - bw / 2}" y="${Math.min(v, z)}" width="${bw}" height="${Math.max(1, Math.abs(z - v))}" rx="1" fill="${p[1] < 0 ? "var(--dn)" : "var(--up)"}" opacity="${dim}"/>`; });
      return;
    }
    const pts = s.pts.map(p => `${x(idx.get(p[0])).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
    if (kind === "Area") svg += `<polygon points="${x(idx.get(s.pts[0][0]))},${y(lo)} ${pts} ${x(idx.get(s.pts[s.pts.length - 1][0]))},${y(lo)}" fill="${s.color}" opacity="${0.12 * dim}"/>`;
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.real ? 2.5 : 1.6}" ${s.dash ? 'stroke-dasharray="5 4"' : ""} opacity="${dim}" stroke-linejoin="round"/>`;
  });
  CH[id] = {days, shown, unit, W, H, x, y};
  // axis values as page text (the drawing stretches to the card width, so text inside it would stretch too)
  const ax = v => unit === "%" ? pct(v, Math.abs(hi - lo) < 10 ? 1 : 0) : srs(v), at = v => (y(v) / H * 100).toFixed(1) + "%";
  const long = days.length > 1 && (new Date(days[days.length - 1]) - new Date(days[0])) > 400 * 864e5;
  const dl = d => dm(d) + (long ? " '" + d.slice(2, 4) : "");
  const yAxis = [hi, (hi + lo) / 2, lo].map(v => `<span class="ya" style="top:${at(v)}">${ax(v)}</span>`).join("");
  const xAxis = `<div class="xa"><span>${dl(days[0])}</span>${days.length > 2 ? `<span>${dl(days[Math.floor(days.length / 2)])}</span>` : ""}${days.length > 1 ? `<span>${dl(days[days.length - 1])}</span>` : ""}</div>`;
  const legend = shown.length > 1 ? `<details class="lgd"${S.open["lg:" + id] ? " open" : ""} data-lgd="${id}"><summary>Legend (${shown.length}) ▾</summary>${shown.map(s => `<button class="lg" data-hl="${id}" data-name="${esc(s.name)}" aria-pressed="${hl === s.name}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("")}</details>` : "";
  return card(title, `${top}<div class="cw"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-chart="${id}" role="img" aria-label="${esc(title)} chart; tap to read values">${svg}</svg>${yAxis}<div class="ov" id="ov-${id}"></div></div>${xAxis}<div class="rd" id="tip-${id}" hidden></div>${read}${legend}`, `<span>${kSw}&nbsp;${rSw}</span>`);
}
function readChart(id, evt) {  // a guide line at the nearest day, a dot on each line, and every value there
  const c = CH[id], svg = document.querySelector(`svg[data-chart="${id}"]`), tip = document.getElementById("tip-" + id), ov = document.getElementById("ov-" + id);
  if (!c || !svg || !tip || !ov) return;
  const r = svg.getBoundingClientRect(), px = (evt.clientX - r.left) / r.width * c.W;
  let best = 0; c.days.forEach((d, i) => { if (Math.abs(c.x(i) - px) < Math.abs(c.x(best) - px)) best = i; });
  const day = c.days[best], fmt = v => c.unit === "%" ? pct(v) : srs(v), left = c.x(best) / c.W * 100;
  const at = c.shown.map(s => ({s, p: s.pts.find(q => q[0] === day)})).filter(o => o.p).sort((a, b) => b.p[1] - a.p[1]);
  ov.innerHTML = `<i class="gl" style="left:${left}%"></i>` + at.map(o => `<i class="dot" style="left:${left}%;top:${c.y(o.p[1]) / c.H * 100}%;background:${o.s.color}"></i>`).join("");
  ov.innerHTML += `<span class="gd" style="left:${left}%;transform:translateX(${left > 80 ? -100 : left < 20 ? 0 : -50}%)">${dm(day)}</span>`;
  tip.innerHTML = at.map(o => `<div class="tl"><i style="background:${o.s.color}"></i>${esc(o.s.name)}<b>${fmt(o.p[1])}</b></div>`).join("");
  tip.hidden = false;  // the values sit under the chart so they never hide the lines
}

  if ((w.days || []).length) h += chart("world", "World vs India", Object.entries(w.series || {}).map(([name, v]) => ({name, real: name === "Nifty 50", dash: name === "Sensex", home: name === "Nifty 50" || name === "Sensex",
    pts: v.map((c, i) => [w.days[i], c]).filter(p => p[1] != null)})).filter(x => x.pts.length), "%", "1Y", "", true);
  if (read) h += card("Today's read", note(read));
  const sec = sectors();
  if (sec.length) {
    const [s, mode] = sw("secview", ["Grid", "List"]);
    const listOf = (x, label) => `<div style="grid-column:1/-1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:4px">${label ? `<span class="lbl">${esc(x.name)}, ${x.rows.length} stock${x.rows.length === 1 ? "" : "s"}</span>` : ""}${topN("sec:" + x.name, x.rows.slice().sort((a, b) => b.change_pct - a.change_pct).map(r => row(`${esc(r.symbol)} ${link(r.symbol)}`, rs(r.close, 2), pct(r.change_pct), cls(r.change_pct))))}</div>`;
    const SHORT = {"Telecommunication": "Telecom", "Information Technology": "IT", "Oil Gas & Consumable Fuels": "Oil & Gas",
      "Fast Moving Consumer Goods": "FMCG", "Automobile and Auto Components": "Auto", "Media Entertainment & Publication": "Media",
      "Construction Materials": "Cement etc.", "Consumer Durables": "Durables"};  // grid tiles are narrow; the list view keeps full names
    const at = sec.findIndex(x => x.name === S.sector);
    let body;
    if (mode === "Grid") {  // the list goes after the row of three that holds the tapped sector
      const cells = sec.map(x => `<button data-sector="${esc(x.name)}" aria-pressed="${S.sector === x.name}" aria-expanded="${S.sector === x.name}"><span style="font-size:12px;overflow-wrap:anywhere">${esc(SHORT[x.name] || x.name)}</span><b class="${cls(x.chg)}">${pct(x.chg)}</b></button>`);
      if (at >= 0) cells.splice(Math.min(sec.length, Math.floor(at / 3) * 3 + 3), 0, listOf(sec[at], true));
      body = `<div class="sec">${cells.join("")}</div>`;
    } else body = sec.map((x, i) => `<button class="row" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;border-top:1px solid var(--soft);padding:8px 0 0;text-align:left;cursor:pointer" data-sector="${esc(x.name)}" aria-expanded="${i === at}"><span class="n"><b style="font-weight:600">${esc(x.name)}</b><span>${x.rows.length} stock${x.rows.length === 1 ? "" : "s"}</span></span><span class="r ${cls(x.chg)}">${pct(x.chg)}</span></button>` + (i === at ? listOf(x) : "")).join("");
    const list = "";
    h += card(`Sectors at the close · ${dm(sec[0].day)}`, body + list, s);
  }
  const g = [t("gold999", 0, true), t("silver999", 0, true)].filter(Boolean);
  if (g.length) h += card("Gold & silver (IBJA)", tiles(g, 2), `<span class="lbl">${dm(m("gold999") && m("gold999").as_of)}</span>`);
  const u = [t("usdinr", 2, true), t("acn", 2, true)].filter(Boolean);

  const f = [t("petrol", 2, true), t("diesel", 2, true), t("cng", 2, true)].filter(Boolean);
  if (f.length) h += card("Fuel in Mumbai", tiles(f, 3), `<span class="lbl">${dm(m("petrol") && m("petrol").as_of)}</span>`);
  return h || card("", note("No market data yet."));
}

// ---- TFeed ---------------------------------------------------------------------------------------------------
const KIND = t => /\b(BUY|SELL)\b.*(entry|stop|target)/i.test(t) ? "Proposals" : /\b(closed|exit|square)/i.test(t) ? "Exits"
  : /(brief|gift nifty|FII|DII|good morning|watch)/i.test(t) ? "Briefs" : /(alert|failed|silent|error|token)/i.test(t) ? "Alerts" : "Other";
function feedTab() {
  const rows = ds("feed");
  if (!rows.length) return card("", note("No messages yet."));
  const kinds = ["All", "Proposals", "Exits", "Briefs", "Alerts"];
  const chips = `<div class="chips">${kinds.map(k => `<button class="chip" data-feed="${k}" aria-pressed="${S.feed === k}">${k}</button>`).join("")}</div>`;
  const shown = rows.filter(r => S.feed === "All" || KIND(r.text || "") === S.feed);
  const items = shown.map(r => `<article class="msg"><div class="ch lbl"><span>${KIND(r.text || "")}</span><span>${dm(r.sent_at)} · ${hm(String(r.sent_at).replace(" ", "T"))}</span></div><p>${esc(r.text)}</p></article>`);
  return chips + topN("feed", items, 20);
}

// ---- Explore -------------------------------------------------------------------------------------------------
function searchBox() {
  return `<div class="search" style="margin:0"><label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search stocks</label>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Search stocks" autocomplete="off" value="${esc(S.q)}" style="background:var(--card)"><div id="sugg">${suggestions()}</div></div>`;
}
const INDEX_PAGES = {  // indices in search; slugs checked against upstox.com/indices on 28 Nov
  "Nifty 50": "nifty-50", "Sensex": "sensex", "Nifty Next 50": "nifty-next-50", "Bank Nifty": "nifty-bank",
  "Nifty 100": "nifty-100", "Nifty 200": "nifty-200", "Nifty 500": "nifty-500", "Fin Nifty": "nifty-fin-service",
  "Nifty Midcap 50": "nifty-midcap-50", "Nifty Smallcap 50": "nifty-smlcap-50", "India VIX": "india-vix",
  "BSE 100": "bse100", "BSE 200": "bse200", "BSE 500": "bse500", "BSE Midcap": "midcap", "BSE Smallcap": "smlcap"};
const indexLink = n => `https://upstox.com/indices/${INDEX_PAGES[n]}-share-price/`;
function exploreLists() {  // name -> rows, for Today's lists
  const eq = new Map(ds("eq_day").map(r => [r.symbol, r])), all = ds("eq_day").filter(r => stockOf(r.symbol));
  const srow = (sym, sub) => { const e = eq.get(sym), st = stockOf(sym); return row(`${esc(sym)} ${link(sym)}`, sub != null ? sub : esc(st ? st.n : ""), e ? pct(e.change_pct) : "", e ? cls(e.change_pct) : ""); };
  return {srow, lists: {
    "Top gainers": () => all.slice().sort((a, b) => b.change_pct - a.change_pct).map(r => srow(r.symbol, rs(r.close, 2))),
    "Top losers": () => all.slice().sort((a, b) => a.change_pct - b.change_pct).map(r => srow(r.symbol, rs(r.close, 2))),
    "Most active (volume)": () => all.slice().sort((a, b) => b.volume - a.volume).map(r => srow(r.symbol, num(r.volume) + " shares")),

    "Highest delivery %": () => all.filter(r => r.deliv_pct != null && r.volume > 1e5).sort((a, b) => b.deliv_pct - a.deliv_pct).map(r => srow(r.symbol, num(r.deliv_pct, 1) + "% delivered")),
    "52-week highs": () => all.filter(r => r.hi52 && r.close >= r.hi52 * 0.999).map(r => srow(r.symbol, "at " + rs(r.close, 2))),
    "52-week lows": () => all.filter(r => r.lo52 && r.close <= r.lo52 * 1.001).map(r => srow(r.symbol, "at " + rs(r.close, 2))),
    "Bulk and block deals": () => ds("deals").map(d => row(`${esc(d.symbol)} ${link(d.symbol)}`, `${esc(d.kind)}, ${esc(d.client)}, ${dm(d.day)}`, `${esc(d.side)} ${rs(d.value_cr, 1)} cr`)),
    "In the news": () => ds("filings").map(f => row(`${esc(f.symbol)} ${link(f.symbol)}`, `${esc((f.what || "").slice(0, 60))}, ${dm(f.filed_at)}`, f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener">Filing ↗</a>` : "")),
    "From our pools": () => [...new Set(ds("decisions").map(e => e.symbol).filter(Boolean))].map(sym => { const e = ds("decisions").find(x => x.symbol === sym);
      return srow(sym, `${POOL[e.pool] || e.pool}, ${({exit: "sold", pass: "passed", fill: "bought", placed: "placed", review: "proposed", skipped: "skipped", not_approved: "not approved"})[e.event] || e.event}, ${dm(e.trade_date)}`); }),
    "F&O stocks": () => S.stocks.stocks.filter(x => x.lot).map(x => srow(x.s, `${esc(x.n)}, lot ${num(x.lot)}`))}};

const openBtn = (kind, name, sub, right, c) => `<button class="row" data-open="${kind}" data-name="${esc(name)}" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;border-top:1px solid var(--soft);padding:8px 0 0;text-align:left;cursor:pointer"><span class="n"><b style="font-weight:600">${esc(name)}</b>${sub ? `<span>${sub}</span>` : ""}</span><span class="r ${c || "mute"}">${right || "›"}</span></button>`;
function explorePage() {  // one selected index, sector or list on its own page
  const {kind, name} = S.page, {srow, lists} = exploreLists(), eq = new Map(ds("eq_day").map(r => [r.symbol, r]));
  let rows = [], extra = "";
  if (kind === "index") {
    rows = ((S.stocks.indices || {})[name] || []).slice().sort((a, b) => ((eq.get(b) || {}).change_pct || 0) - ((eq.get(a) || {}).change_pct || 0)).map(x => srow(x));

  } else if (kind === "sector") {
    const sec = sectors().find(x => x.name === name);

  } else rows = lists[name] ? lists[name]() : [];

function exploreTab() {
  if (!S.stocks) return card("", note("The stock list hasn't loaded yet."));
  if (S.page) return explorePage();
  let h = searchBox();
  const recent = P.recent || [];
  if (recent.length) h += card("Recently viewed", `<div class="chips">${recent.map(x => { const st = stockOf(x); return st ? `<a class="chip" href="${esc(st.u)}" target="_blank" rel="noopener" data-viewed="${esc(x)}">${esc(x)}</a>` : ""; }).join("")}</div>`, `<button class="sw" data-clearrecent="1" aria-label="Clear recently viewed">✕ Clear</button>`);

  if (sec.length) h += card("By sector", topN("bysec", sec.map(x => openBtn("sector", x.name, `${x.rows.length} stock${x.rows.length === 1 ? "" : "s"}`, pct(x.chg), cls(x.chg)))));

  return h;
}

// ---- Ratings and Performance ---------------------------------------------------------------------------------
function ratingsTab() {
  const calls = ds("your_calls"), sum = r => calls.filter(c => c.rating === r).reduce((a, c) => ({t: a.t + c.trades, w: a.w + (r === "up" ? c.won : c.trades - c.won)}), {t: 0, w: 0});
  const u = sum("up"), d = sum("down"), un = sum("unrated");
  let h = "";
  if (calls.length) h += card("Your calls", tiles([tile("Thumbs-up right", u.t ? pct(u.w / u.t * 100, 0).replace("+", "") : "–", `of ${u.t}`, "up"),
                                                   tile("Thumbs-down right", d.t ? pct(d.w / d.t * 100, 0).replace("+", "") : "–", `of ${d.t}`, "up"),
                                                   tile("Unrated", String(un.t), "trades")], 3));
  const daily = ds("trading_daily");
  if (daily.length) {
    const series = Object.keys(POOL).map(p => ({name: POOL[p], pts: cumulative(daily.filter(r => r.pool === p).map(r => [r.day, r.net_rs]))})).filter(s => s.pts.length);
    h += card("Performance", Object.keys(POOL).map(p => { const x = poolNow(p); return x ? row(POOL[p], `${rs(x.balance)} now`, pct((x.balance / x.start - 1) * 100), cls(x.balance - x.start)) : ""; }).join(""));
    h += chart("perf", "Net by pool", series, "₹");
  }
  const tl = ds("timeline");
  if (tl.length) {
    const avg = k => tl.reduce((a, r) => a + (r[k] || 0), 0) / tl.length;
    const auto = tl.filter(r => r.approval === "auto").length;
    h += card("Who took how long (average a trade)", row("Facts", "", num(avg("facts_s"), 1) + " s") + row("AI deciding", "", num(avg("ai_decide_s") / 60, 1) + " min")
      + row("Council", "", num(avg("council_s"), 1) + " s") + row("Approval", `${auto} of ${tl.length} automatic`, num(avg("approval_s"), 0) + " s")
      + row("Placing", "", num(avg("placing_s"), 0) + " s") + row("Fill", "", num(avg("fill_s"), 1) + " s") + row("Holding", "", num(avg("hold_min"), 0) + " min"),
      `<span class="lbl">${tl.length} trades</span>`);
  }
  const bs = ds("by_setup");
  if (bs.length) h += card("By setup", topN("setup", bs.map(r => row(esc(r.setup), `${POOL[r.pool] || r.pool}, ${r.trades} trades, ${num(r.win_pct, 0)}% won`, srs(r.net_rs), cls(r.net_rs)))));
  return h || card("", note("No rated trades yet."));
}

const ICON = {stocks: '<path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/>', markets: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  feed: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/>',
  explore: '<circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20"/><path d="M7.5 9h5M7.5 11.5h3"/>',
  ratings: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const TABS = [["stocks", "Stocks"], ["markets", "Markets"], ["feed", "TFeed"], ["explore", "Explore"], ["ratings", "Ratings and Performance"]];
const svgI = (p, w = 24, sw2 = 1.8) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function suggestions() {
  const q = S.q.trim().toUpperCase();
  if (!q || !S.stocks) return "";
  const idx = Object.keys(INDEX_PAGES).filter(n => n.toUpperCase().includes(q)).map(n => {
    const m = market(n === "Nifty 50" ? "nifty50" : n === "Sensex" ? "sensex" : n === "India VIX" ? "vix" : "");
    const has = ((S.stocks.indices || {})[n] || []).length, sub = `Index${has ? `, ${has} stocks` : ""}${m ? `, ${num(m.value, m.value >= 1000 ? 0 : 2)} (${pct(m.change_pct)})` : ""}`;
    return `<div class="row" style="padding:8px 12px">${has ? `<button data-open="index" data-name="${esc(n)}" class="n" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg)">` : `<span class="n">`}<b style="font-weight:600">${esc(n)}</b><span>${sub}</span>${has ? "</button>" : "</span>"}<a class="r" href="${indexLink(n)}" target="_blank" rel="noopener" style="font-size:13px">Upstox ↗</a></div>`;
  }).join("");
  const hits = S.stocks.stocks.filter(s => s.s.startsWith(q)).concat(S.stocks.stocks.filter(s => !s.s.startsWith(q) && s.n.toUpperCase().includes(q))).slice(0, 8);
  return `<div class="sugg" role="listbox" aria-label="Matching stocks and indices">${idx}${hits.length || idx ? hits.map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener" data-viewed="${esc(s.s)}" class="row" style="padding:8px 12px;color:var(--fg)"><span class="n"><b style="font-weight:600">${esc(s.s)}</b><span>${esc(s.n)}</span></span><span class="r" style="color:var(--accent);font-size:13px">Upstox ↗</span></a>`).join("") : `<p class="note" style="padding:12px">No stock or index matches “${esc(S.q)}”.</p>`}</div>`;

function header() {
  const title = S.tab === "stocks" ? "Stocks" : TABS.find(t => t[0] === S.tab)[1];
  const dark = document.documentElement.dataset.theme === "dark";
  const upd = S.data ? `Updated ${dm(S.data.updated_at)}, ${hm(S.data.updated_at)}` : "";
  const sub = S.tab === "stocks" ? `<div class="sub" role="group" aria-label="Stocks sections">${[["desk", "Desk"], ["intraday", "Intraday"], ["swing", "Swing"], ["long", "Long"]].map(([k, n]) => `<button data-sub="${k}" aria-pressed="${S.sub === k}">${n}</button>`).join("")}</div>` : "";
  return `<div class="hrow"><h1>${title}</h1><div class="hrow"><span class="pill" title="${esc(upd)}">Paper money</span>
    <button class="icon" id="theme" aria-label="Switch to ${dark ? "light" : "dark"} theme">${dark  // like the old app: a sun in dark mode, a moon in light
      ? svgI('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 20, 2)
      : svgI('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>', 20, 2)}</button></div></div>

function render() {
  const keepFocus = document.activeElement && document.activeElement.id === "q";
  document.getElementById("hdr").innerHTML = header();
  document.getElementById("nav").innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" aria-label="${n}" title="${n}"${S.tab === k ? ' aria-current="page"' : ""}>${svgI(ICON[k], 24, S.tab === k ? 2.2 : 1.7)}</button>`).join("");
  let body;
  if (!S.data) body = card("", S.error ? `<h2>Couldn't load the data</h2>${note("Check the connection, then pull down or reopen the app to try again.")}` : note("Loading…"));
  else if (S.tab === "stocks") body = S.sub === "desk" ? desk() : S.sub === "intraday" ? intraday() : holdPool(S.sub === "swing" ? "swing" : "long_term");
  else body = {markets: marketsTab, feed: feedTab, explore: exploreTab, ratings: ratingsTab}[S.tab]();
  if (S.data && S.offline) body = card("", note(`Showing the copy saved on this phone (${dm(S.data.updated_at)}, ${hm(S.data.updated_at)}); the latest couldn't load.`)) + body;

// ---- Events --------------------------------------------------------------------------------------------------
document.addEventListener("pointermove", e => { const t = e.target.closest && e.target.closest("svg[data-chart]"); if (t) readChart(t.dataset.chart, e); });
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, svg[data-chart]");
  if (!t) { if (S.q) { S.q = ""; render(); } return; }
  const d = t.dataset;
  if (t.matches("svg[data-chart]")) return readChart(d.chart, e);
  if (d.clearrecent) { P.recent = []; save(); return render(); }
  if (d.viewed) { P.recent = [d.viewed].concat((P.recent || []).filter(s => s !== d.viewed)).slice(0, 10); save(); return; }
  if (t.tagName === "A") return;
  if (t.id === "theme") { const dark = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = dark ? "dark" : "light"; P.theme = dark ? "dark" : "light"; save(); return render(); }
  if (d.tab) { S.tab = P.tab = d.tab; S.q = ""; S.page = null; save(); window.scrollTo(0, 0); return render(); }
  if (d.sub) { S.sub = P.sub = d.sub; save(); return render(); }
  if (d.sw) { P.sw = P.sw || {}; P.sw[d.sw] = ((P.sw[d.sw] || 0) + 1) % +d.n; save(); return render(); }
  if (d.seg) { P.seg = P.seg || {}; P.seg[d.seg] = d.v; save(); return render(); }
  if (d.more) { S.open[d.more] = !S.open[d.more]; return render(); }
  if (d.hl) { P.hl = P.hl || {}; P.hl[d.hl] = P.hl[d.hl] === d.name ? null : d.name; S.open["lg:" + d.hl] = true; save(); return render(); }
  if (d.sector) { S.sector = S.sector === d.sector ? null : d.sector; return render(); }
  if (d.open) { S.page = {kind: d.open, name: d.name}; S.q = ""; window.scrollTo(0, 0); return render(); }
  if (d.back) { S.page = null; return render(); }
  if (d.feed) { S.feed = d.feed; return render(); }
});
document.addEventListener("toggle", e => { if (e.target.dataset && e.target.dataset.lgd) S.open["lg:" + e.target.dataset.lgd] = e.target.open; }, true);
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; document.getElementById("sugg").innerHTML = suggestions(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.q) { S.q = ""; render(); } });

// ---- Load: the latest data, or the copy saved on this phone ---------------------------------------------------
async function load() {
  try {
    const r = await fetch("data/desk.json", {cache: "no-cache"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    S.data = await r.json(); S.offline = false;
    try { localStorage.setItem("upx-desk", JSON.stringify(S.data)); } catch (e) { /* too big or private mode: fine */ }
  } catch (err) {
    try { S.data = JSON.parse(localStorage.getItem("upx-desk")); S.offline = !!S.data; } catch (e) { S.data = null; }
    S.error = String(err);
  }
  render();
  try {
    const r = await fetch("data/stocks.json");
    if (r.ok) { const s = await r.json(); s.bySym = Object.fromEntries(s.stocks.map(x => [x.s, x])); S.stocks = s; render(); }
  } catch (e) { /* search and links wait for the next load */ }
}
load();
</script>
</body>
</html>
